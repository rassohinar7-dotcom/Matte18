name: Windows packaged runtime
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-smoke.yml
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify 0.6.7 beta
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request, zipfile
          release = json.load(urllib.request.urlopen('https://api.github.com/repos/${{ github.repository }}/releases/tags/v0.6.7'))
          asset = next(a for a in release['assets'] if a['name']=='Matte18-0.6.7-Windows-x64.exe')
          data = urllib.request.urlopen(asset['browser_download_url']).read()
          assert hashlib.sha256(data).hexdigest() == '7e504720cc27cc26bfd846c10738a134a59adb2a643f161e9f2ff6794ad9ed58'
          pathlib.Path('Matte18.exe').write_bytes(data)
          with zipfile.ZipFile('Matte18.exe') as z:
              assert z.testzip() is None
              z.extractall('bundle')
      - name: Check native USB dependencies without connecting a phone
        shell: pwsh
        run: |
          & .\bundle\runtime\python.exe .\bundle\app\entry.py --check-runtime
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:LOCALAPPDATA\Matte18\launch-error.txt" -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content "$env:LOCALAPPDATA\Matte18\launch-diagnostics.json"
      - name: Start the packaged GUI in demo mode
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          & .\bundle\runtime\python.exe -c 'import runpy,sys; p="bundle/app/entry.py"; ns=runpy.run_path(p); sys.argv=[p,"--smoke"]; sys.exit(ns["run"]())'
          if ($LASTEXITCODE -ne 0) { exit 1 }

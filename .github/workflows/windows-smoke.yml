name: Windows packaged runtime
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-smoke.yml
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the packaged beta
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, pathlib, urllib.request, zipfile
          base = 'https://api.github.com/repos/${{ github.repository }}/releases'
          def request(url, binary=False):
              headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/octet-stream' if binary else 'application/vnd.github+json', 'User-Agent': 'Matte18-runtime-check'}
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers)).read()
          releases = json.loads(request(base))
          release = next(r for r in releases if r['tag_name']=='v0.6.6')
          asset = next(a for a in release['assets'] if a['name']=='Matte18-0.6.6-Windows-x64.exe')
          data = request(asset['url'], True)
          assert hashlib.sha256(data).hexdigest() == '273a500f486d2d155fb4c25abde9ff4b53983b588054e4ba47d87353699bfb9d'
          pathlib.Path('Matte18.exe').write_bytes(data)
          with zipfile.ZipFile('Matte18.exe') as z:
              assert z.testzip() is None
              z.extractall('bundle')
      - name: Check native USB dependencies without connecting a phone
        shell: pwsh
        run: |
          & .\bundle\runtime\python.exe .\bundle\app\entry.py --check-runtime
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:LOCALAPPDATA\Matte18\launch-error.txt" -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content "$env:LOCALAPPDATA\Matte18\launch-diagnostics.json"

name: Windows packaged runtime
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - .github/workflows/windows-smoke.yml
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify the published Windows package
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, zipfile
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          release = event.get('release')
          if not release:
              release = json.load(urllib.request.urlopen('https://api.github.com/repos/${{ github.repository }}/releases'))[0]
          asset = next(a for a in release['assets'] if a['name'].endswith('-Windows-x64.exe'))
          data = urllib.request.urlopen(asset['browser_download_url']).read()
          assert 'sha256:'+hashlib.sha256(data).hexdigest() == asset['digest']
          print('Verified package:',asset['name'])
          pathlib.Path('Matte18.exe').write_bytes(data)
          with zipfile.ZipFile('Matte18.exe') as z:
              assert z.testzip() is None
              z.extractall('bundle')
      - name: Check native dependencies without connecting a phone
        shell: pwsh
        run: |
          & .\bundle\runtime\python.exe .\bundle\app\entry.py --check-runtime
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test backup parsing and WebClip delivery regressions without a phone
        shell: pwsh
        run: |
          & .\bundle\runtime\python.exe -c 'import runpy,sys,pathlib,unittest; root=pathlib.Path("bundle").resolve(); ns=runpy.run_path(str(root/"app/entry.py")); ns["configure_runtime"](root); sys.path.insert(0,str(root/"app/tests")); suite=unittest.TestSuite(unittest.defaultTestLoader.discover(str(root/"app/tests"),pattern=p) for p in ("test_backup_validation.py","test_webclips.py")); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful())'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the isolated AirTraffic helper runtime
        shell: pwsh
        run: |
          '{"runtime_check":true}' | & .\bundle\runtime\python.exe -I .\bundle\app\vendor\airtraffic_sync.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Start and close the packaged GUI in demo mode
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          & .\bundle\runtime\python.exe -c 'import runpy,sys; p="bundle/app/entry.py"; ns=runpy.run_path(p); sys.argv=[p,"--smoke"]; sys.exit(ns["run"]())'
          if ($LASTEXITCODE -ne 0) { exit 1 }
